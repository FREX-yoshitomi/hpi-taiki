<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>パーソナルファイル — 吉富大起</title>
<meta name="description" content="散らばった人生の情報を、ひとつのファイルに。人を引き、繋がりを辿り、思い出す。" />
<style>
  :root{
    --bg:#eaf0f8; --bg2:#f6f9fd; --surface:#ffffff;
    --ink:#13233b; --ink2:#3a4c66; --muted:#7589a2; --faint:#9fb0c6;
    --line:#e4ebf4; --line2:#d7e1ee;
    --blue:#1672ec; --blue-deep:#0b54b8; --blue-soft:#5aa0ff; --sky:#e9f2fe; --sky2:#f2f8ff;
    --green:#15b371; --amber:#e6a23a;
    --radius:20px;
    --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono","Consolas",monospace;
    --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP","Segoe UI",system-ui,sans-serif;
    --shadow:0 1px 2px rgba(16,40,80,.04), 0 10px 30px rgba(16,40,80,.06);
    --shadow-sm:0 1px 2px rgba(16,40,80,.05), 0 4px 14px rgba(16,40,80,.05);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(1100px 520px at 78% -8%,rgba(90,160,255,.18),transparent 60%),
      radial-gradient(900px 500px at 0% 0%,rgba(21,179,113,.06),transparent 55%),linear-gradient(180deg,#eef4fc,var(--bg));}
  a{color:var(--blue);text-decoration:none;} a:hover{text-decoration:underline;text-underline-offset:3px;}
  .wrap{max-width:880px;margin:0 auto;padding:0 22px;}
  .mono{font-family:var(--mono);}

  #intro{position:fixed;inset:0;z-index:200;background:linear-gradient(180deg,#fbfdff,#eaf2fd);display:flex;align-items:center;justify-content:center;transition:opacity .55s ease;}
  #intro.gone{opacity:0;pointer-events:none;}
  #intro .mk{width:62px;height:62px;border-radius:18px;margin:0 auto 18px;background:linear-gradient(135deg,var(--blue),var(--blue-soft));box-shadow:0 12px 30px rgba(22,114,236,.35);display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:800;animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both;}
  #intro .t{font-size:15px;letter-spacing:.34em;color:var(--blue-deep);font-weight:700;margin-left:.34em;text-align:center;}
  #intro .nm{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.05em;text-align:center;}
  #intro .bar{width:160px;height:4px;border-radius:3px;background:rgba(22,114,236,.14);margin:18px auto 0;overflow:hidden;}
  #intro .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--blue-soft));animation:fill 1.1s ease forwards;}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fill{to{width:100%}}

  #demoBadge{text-align:center;font-size:12.5px;color:var(--blue-deep);background:var(--sky);border-bottom:1px solid #d6e6fb;padding:8px 14px;font-weight:600;}
  #demoBadge b{color:var(--blue);}

  header.top{position:sticky;top:0;z-index:50;background:rgba(246,249,253,.82);backdrop-filter:saturate(140%) blur(12px);border-bottom:1px solid var(--line);}
  header.top .wrap{display:flex;align-items:center;gap:12px;height:58px;}
  header.top .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--ink);}
  header.top .brand .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--blue-soft));display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800;box-shadow:0 4px 12px rgba(22,114,236,.3);}
  header.top .brand small{color:var(--muted);font-weight:500;font-family:var(--mono);font-size:11.5px;}
  header.top nav{margin-left:auto;display:flex;gap:18px;}
  header.top nav a{font-size:13px;color:var(--muted);font-weight:600;} header.top nav a:hover{color:var(--blue);text-decoration:none;}

  .hero{margin:28px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;}
  .hero .band{height:84px;background:linear-gradient(120deg,#1672ec,#3f8bf5 55%,#5ec8e0);position:relative;}
  .hero .band::after{content:"PERSONAL FILE";position:absolute;right:20px;bottom:12px;color:rgba(255,255,255,.82);font-family:var(--mono);font-size:11px;letter-spacing:.28em;font-weight:600;}
  .hero .body{padding:0 30px 26px;display:flex;gap:22px;align-items:flex-end;margin-top:-44px;}
  @media(max-width:600px){.hero .body{flex-direction:column;align-items:center;text-align:center;gap:14px;}}
  .ava{width:96px;height:96px;border-radius:22px;flex:none;border:4px solid #fff;overflow:hidden;box-shadow:0 8px 22px rgba(16,40,80,.16);background:#dfe8f4;}
  .ava img{width:100%;height:100%;object-fit:cover;display:block;}
  .ava .mono{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;color:var(--blue);background:linear-gradient(135deg,#eaf2fe,#dbe8fb);}
  .hero .who{flex:1;padding-bottom:4px;min-width:0;}
  .hero .who h1{margin:0;font-size:clamp(26px,4.4vw,34px);font-weight:800;letter-spacing:.01em;color:var(--ink);}
  .hero .who .romaji{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.16em;margin-top:4px;}
  .hero .who .idline{font-size:14px;color:var(--ink2);margin-top:10px;}
  .hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  @media(max-width:600px){.hero .chips{justify-content:center;}}
  .chip{font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--sky);color:var(--blue-deep);}
  .chip.grey{background:#eef2f7;color:var(--ink2);} .chip.lock{background:#eef2f7;color:var(--muted);}

  /* スポットライト検索(人物を引く) */
  .spot{margin:16px 0 0;position:relative;}
  .spot .field{position:relative;}
  .spot input{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:16px 18px 16px 50px;color:var(--ink);font-family:var(--sans);font-size:15.5px;outline:none;box-shadow:var(--shadow-sm);}
  .spot input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(22,114,236,.12),var(--shadow-sm);}
  .spot .mg{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--blue);font-size:18px;}
  .spot .drop{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(16,40,80,.18);padding:8px;z-index:40;display:none;max-height:340px;overflow:auto;}
  .spot .drop.on{display:block;}
  .res{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;}
  .res:hover{background:var(--sky2);}
  .res .pa{width:36px;height:36px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;}
  .res .nm{font-weight:700;font-size:14px;color:var(--ink);}
  .res .sub{font-size:11.5px;color:var(--muted);font-family:var(--mono);}
  .res .go{margin-left:auto;color:var(--faint);font-size:13px;}
  .res-none{padding:14px 14px;color:var(--muted);font-size:13px;}
  .res-head{font-size:11px;letter-spacing:.08em;color:var(--faint);font-family:var(--mono);text-transform:uppercase;padding:8px 12px 4px;}

  section.card{margin:18px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:22px 26px;}
  @media(max-width:600px){section.card{padding:18px 18px;}}
  .sec-h{display:flex;align-items:center;gap:10px;margin:0 0 4px;}
  .sec-h h2{font-size:16px;font-weight:750;margin:0;color:var(--ink);}
  .sec-h .en{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;margin-left:auto;}
  .sec-sub{font-size:12.5px;color:var(--muted);margin:0 0 18px;}
  .note{font-size:11.5px;color:var(--faint);margin:14px 2px 0;} .note b{color:var(--blue-deep);}

  .cov{display:flex;align-items:center;gap:16px;}
  .cov .num{font-family:var(--mono);font-weight:800;font-size:30px;color:var(--blue);white-space:nowrap;}
  .cov .num small{font-size:15px;color:var(--muted);font-weight:600;}
  .cov .right{flex:1;}
  .cov .track{height:9px;border-radius:6px;background:#e9eef5;overflow:hidden;}
  .cov .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--blue-soft));width:0;transition:width 1s ease;}
  .cov .cap{font-size:12px;color:var(--muted);margin-top:8px;}

  .prof .row{display:grid;grid-template-columns:128px 1fr;gap:16px;padding:13px 2px;border-bottom:1px solid var(--line);align-items:baseline;}
  .prof .row:last-child{border-bottom:none;}
  @media(max-width:600px){.prof .row{grid-template-columns:1fr;gap:3px;}}
  .prof .k{font-size:12.5px;color:var(--muted);font-weight:600;} .prof .v{font-size:14.5px;color:var(--ink);} .prof .v b{color:var(--blue-deep);}

  /* つながり */
  .people-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media(max-width:680px){.people-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:430px){.people-grid{grid-template-columns:1fr;}}
  .pcard{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fcfdff;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s;}
  .pcard:hover{border-color:var(--blue-soft);transform:translateY(-2px);box-shadow:var(--shadow-sm);}
  .pcard .pa{width:42px;height:42px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;}
  .pcard .nm{font-weight:700;font-size:14px;color:var(--ink);}
  .pcard .rel{font-size:11.5px;color:var(--muted);}
  .pcard .cnt{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--blue-deep);font-weight:700;}

  /* 聞いてみる */
  .ask .field{position:relative;}
  .ask input{width:100%;background:#f5f8fc;border:1px solid var(--line2);border-radius:14px;padding:13px 16px 13px 42px;color:var(--ink);font-family:var(--sans);font-size:14.5px;outline:none;}
  .ask input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(22,114,236,.1);}
  .ask .qi{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--blue);font-weight:800;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 2px;}
  .qchip{font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:#fafcff;color:var(--ink2);cursor:pointer;}
  .qchip:hover{border-color:var(--blue);color:var(--blue);}
  .ans{margin-top:14px;background:var(--sky2);border:1px solid #dcebfd;border-radius:14px;padding:14px 16px;font-size:14px;color:var(--ink);line-height:1.8;}
  .ans b{color:var(--blue-deep);}

  /* 情報源 */
  .cat{margin-top:16px;} .cat:first-child{margin-top:4px;}
  .cat .ch{font-size:12.5px;color:var(--ink2);font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px;}
  .cat .ch .cnt{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:600;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media(max-width:680px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:430px){.grid{grid-template-columns:1fr;}}
  .src-card{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fcfdff;position:relative;}
  .src-card .nm{font-size:13.5px;font-weight:650;color:var(--ink);} .src-card .md{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px;}
  .src-card .st{position:absolute;top:12px;right:13px;font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:5px;}
  .src-card .st i{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .src-card.on{border-color:#c6e0c9;background:#fbfffc;} .src-card.on .st{color:var(--green);} .src-card.on .st i{background:var(--green);box-shadow:0 0 0 3px rgba(21,179,113,.14);}
  .src-card.off{opacity:.62;} .src-card.off .st{color:var(--faint);} .src-card.off .st i{background:var(--faint);}

  /* 記録 */
  .search{position:relative;margin-bottom:8px;}
  .search input{width:100%;background:#f5f8fc;border:1px solid var(--line2);border-radius:13px;padding:12px 16px 12px 40px;color:var(--ink);font-family:var(--sans);font-size:14px;outline:none;}
  .search input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(22,114,236,.1);}
  .search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:15px;}
  .recs{display:flex;flex-direction:column;margin-top:6px;}
  .rec{display:grid;grid-template-columns:116px 138px 1fr;gap:14px;padding:11px 4px;border-bottom:1px solid var(--line);align-items:baseline;}
  @media(max-width:600px){.rec{grid-template-columns:1fr;gap:3px;padding:12px 4px;}}
  .rec .when{font-family:var(--mono);font-size:11.5px;color:var(--muted);}
  .rec .src{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);font-weight:600;background:#f0f4f9;border-radius:7px;padding:2px 9px;}
  .rec .src i{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;}
  .rec .txt{font-size:13.5px;color:var(--ink);}
  .qhead{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:4px 2px 10px;}
  .more{margin:16px auto 0;display:block;background:#fff;border:1px solid var(--line2);color:var(--ink2);font-size:12.5px;font-weight:600;padding:9px 20px;border-radius:11px;cursor:pointer;}
  .more:hover{border-color:var(--blue);color:var(--blue);}

  .heat-scroll{overflow-x:auto;padding-bottom:4px;} .heat-wrap{display:flex;gap:8px;}
  .dow{display:flex;flex-direction:column;gap:3px;padding-top:18px;font-family:var(--mono);font-size:9.5px;color:var(--faint);} .dow span{height:12px;line-height:12px;}
  .month-row{display:flex;gap:3px;height:14px;font-family:var(--mono);font-size:9.5px;color:var(--faint);}
  .heat{display:flex;gap:3px;min-width:max-content;} .heat .col{display:flex;flex-direction:column;gap:3px;}
  .cell{width:12px;height:12px;border-radius:3px;background:#e8edf4;}
  .cell.l1{background:#cfe0fa;} .cell.l2{background:#9cc3f6;} .cell.l3{background:#5a9bf0;} .cell.l4{background:#1672ec;}
  .legend{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11px;color:var(--faint);font-family:var(--mono);} .legend .cell{width:10px;height:10px;}

  /* 人物ファイル(オーバーレイ) */
  .pv{position:fixed;inset:0;z-index:150;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;}
  .pv[hidden]{display:none;}
  .pv-bg{position:fixed;inset:0;background:rgba(20,40,70,.34);backdrop-filter:blur(3px);}
  .pv-wrap{position:relative;width:100%;max-width:680px;}
  .pv-card{background:#fff;border-radius:22px;box-shadow:0 30px 80px rgba(16,40,80,.3);padding:22px 26px 24px;animation:assemble .42s cubic-bezier(.2,.9,.3,1.05) both;}
  @keyframes assemble{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
  .pv-back{background:#f0f4f9;border:none;color:var(--ink2);font-weight:700;font-size:12.5px;padding:7px 14px;border-radius:10px;cursor:pointer;}
  .pv-back:hover{background:#e4ecf5;}
  .pv-head{display:flex;gap:16px;align-items:center;margin:16px 0 4px;}
  .pv-ava{width:64px;height:64px;border-radius:18px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:26px;box-shadow:0 8px 20px rgba(16,40,80,.18);}
  .pv-rel{font-size:11.5px;font-weight:700;color:var(--blue);letter-spacing:.04em;}
  .pv-head h2{margin:2px 0 4px;font-size:23px;color:var(--ink);}
  .pv-meta{font-size:12.5px;color:var(--muted);}
  .pv-bd{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .pb{font-size:12px;background:var(--sky);color:var(--blue-deep);border-radius:999px;padding:5px 12px;font-weight:600;} .pb b{font-family:var(--mono);}
  .pv-sub{font-size:12.5px;color:var(--ink2);font-weight:700;margin:20px 0 8px;border-top:1px solid var(--line);padding-top:16px;}

  footer{padding:28px 0 64px;color:var(--muted);font-size:12px;}
  footer .wrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;}
  .empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:16px;background:#fafcff;font-size:13px;}
  .empty code{color:var(--blue);background:var(--sky);padding:1px 7px;border-radius:5px;font-family:var(--mono);}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

<script>
/* ===== イントロ ===== */
(function(){const intro=document.getElementById("intro");const reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;const go=()=>intro.classList.add("gone");if(reduce){go();}else{const t=setTimeout(go,1500);intro.addEventListener("click",()=>{clearTimeout(t);go();});}})();

/* ===== ユーティリティ ===== */
function pad(n){return n<10?"0"+n:""+n;}
function localKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function count(a){const m={};a.forEach(x=>m[x]=(m[x]||0)+1);return m;}
function topEntries(m,n){return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n);}
const DOW=["日","月","火","水","木","金","土"];
const AV_COLORS=["#1672ec","#15b371","#c061d6","#e6a23a","#10b5c4","#e5594d","#6a5cf0","#0b54b8"];
function avatarFor(name){let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))>>>0;return {initial:[...name][0]||"?",color:AV_COLORS[h%AV_COLORS.length]};}

const STREAMS=[
  {cat:"💬 SNS・メッセージ",items:[{key:"x",nm:"X (Twitter)",mod:"my.x"},{key:"line",nm:"LINE",mod:"my.line"},{key:"instagram",nm:"Instagram",mod:"my.instagram"},{key:"slack",nm:"Slack",mod:"my.slack"},{key:"discord",nm:"Discord",mod:"my.discord"}]},
  {cat:"⚙️ 仕事・開発",items:[{key:"github",nm:"GitHub",mod:"my.github"},{key:"git",nm:"ローカル git",mod:"my.git"},{key:"calendar",nm:"カレンダー",mod:"my.calendar"},{key:"notes",nm:"メモ",mod:"my.notes"},{key:"tasks",nm:"タスク",mod:"my.tasks"},{key:"frex",nm:"FREX",mod:"my.frex"}]},
  {cat:"🫀 健康・ライフログ",items:[{key:"health",nm:"睡眠・運動",mod:"my.health"},{key:"weight",nm:"体重",mod:"my.weight"},{key:"location",nm:"位置情報",mod:"my.location"}]},
  {cat:"🎧 メディア",items:[{key:"youtube",nm:"YouTube",mod:"my.youtube"},{key:"music",nm:"音楽",mod:"my.music"},{key:"reading",nm:"読書",mod:"my.reading"}]},
];
const TOTAL_STREAMS=STREAMS.reduce((a,c)=>a+c.items.length,0);
const SRC_NAME={};STREAMS.forEach(c=>c.items.forEach(it=>SRC_NAME[it.key]=it.nm));
const SRC_CAT={github:"ソフトウェア開発",git:"ソフトウェア開発",calendar:"予定・仕事",notes:"メモ・思考",tasks:"タスク管理",frex:"FREX業務",x:"SNS発信",instagram:"SNS発信",line:"チャット",slack:"チャット",discord:"チャット",health:"健康・睡眠",weight:"体重管理",location:"移動・場所",youtube:"動画視聴",music:"音楽鑑賞",reading:"読書"};
const CAT_COLOR={"ソフトウェア開発":"#1672ec","予定・仕事":"#e6a23a","メモ・思考":"#7a8aa3","タスク管理":"#7a8aa3","FREX業務":"#1672ec","SNS発信":"#22a3d6","チャット":"#6a5cf0","健康・睡眠":"#15b371","体重管理":"#15b371","移動・場所":"#10b5c4","動画視聴":"#e5594d","音楽鑑賞":"#c061d6","読書":"#b9772e"};
function srcColor(s){return CAT_COLOR[SRC_CAT[s]]||"#7589a2";}
function srcLabel(s){return SRC_NAME[s]||s;}

let PEOPLE=[];   // 抽出した人物
let ANALYSIS=null;

/* ===== 読み込み ===== */
async function main(){
  let rows;
  if(window.__PF_DEMO__ && Array.isArray(window.__PF_DEMO__)){
    rows=window.__PF_DEMO__;
    const b=document.getElementById("demoBadge"); if(b) b.hidden=false;
  }else{
    try{const res=await fetch("data/timeline.json",{cache:"no-store"});if(!res.ok)throw new Error(res.status);rows=await res.json();}
    catch(e){document.getElementById("app").innerHTML='<section class="card"><div class="empty">記録がまだありません。<br><br>先に <code>python tools/build_dashboard_data.py</code> を実行してください。</div></section>';return;}
  }
  if(!rows.length){document.getElementById("app").innerHTML='<section class="card"><div class="empty">記録が 0 件です。</div></section>';return;}
  render(rows);
}

/* ===== 解析 ===== */
function analyze(rows){
  rows.forEach(r=>r._d=new Date(r.dt));
  rows.sort((a,b)=>a._d-b._d);
  const first=rows[0]._d,last=rows[rows.length-1]._d;
  const spanDays=Math.max(1,Math.round((last-first)/86400000)+1);
  const perDay={};rows.forEach(r=>{const k=localKey(r._d);perDay[k]=(perDay[k]||0)+1;});
  const activeDays=Object.keys(perDay);
  const hours=Array(24).fill(0);rows.forEach(r=>hours[r._d.getHours()]++);
  const dows=Array(7).fill(0);rows.forEach(r=>dows[r._d.getDay()]++);
  const peakHour=hours.indexOf(Math.max(...hours)),peakDow=dows.indexOf(Math.max(...dows));
  const byRepo=count(rows.map(r=>r.repo).filter(Boolean));
  const cutoff=new Date(last);cutoff.setDate(cutoff.getDate()-30);
  const recentRepo=topEntries(count(rows.filter(r=>r._d>=cutoff).map(r=>r.repo).filter(Boolean)),1)[0];
  const frex=rows.map(r=>r.repo).filter(Boolean).some(x=>/frex/i.test(x));
  const connected=[...new Set(rows.map(r=>r.source))];
  const chrono=peakHour>=5&&peakHour<=10?"朝型":peakHour>=11&&peakHour<=17?"日中型":"夜型";
  const byCat=count(rows.map(r=>SRC_CAT[r.source]||r.source));
  const topCats=topEntries(byCat,3).map(([k])=>k);
  return {rows,first,last,spanDays,perDay,activeDays,hours,dows,peakHour,peakDow,byRepo,recentRepo,frex,connected,chrono,topCats,total:rows.length};
}

/* ===== 人物抽出(コミット共著・@メンション・MTG同席) ===== */
function extractPeople(rows){
  const map={};
  const get=n=>{if(!map[n])map[n]={name:n,dev:0,meet:0,chat:0,recSet:new Set(),first:null,last:null};return map[n];};
  const touch=(p,r)=>{p.recSet.add(r);const d=r._d||new Date(r.dt);if(!p.first||d<p.first)p.first=d;if(!p.last||d>p.last)p.last=d;};
  const bad=/^(noreply|anthropic|local|gmail|com|co|jp|net|org|mentions?|deprecated|param|returns?|name|names|type|todo|trigger|click|input|media|example)$/i;
  const MENTION_SRC=new Set(["x","slack","line","discord","instagram","calendar"]);  // @ が「人」を指す源だけ(コミット中の @ は npm scope や JSDoc 等のノイズなので除外)
  rows.forEach(r=>{
    const body=(r.body||"")+" "+(r.text||"");
    let m;
    const co=/Co-Authored-By:\s*([^<\n]+?)\s*</gi;
    while((m=co.exec(body))){let n=m[1].replace(/\(.*$/,"").trim().split(/\s+/).filter(w=>w&&!/^[\d.]/.test(w)).join(" ");if(n&&!bad.test(n)){const p=get(n);p.dev++;touch(p,r);}}
    if(MENTION_SRC.has(r.source)){
      const me=/@([^\s@<>()「」、。/]+)/g;
      while((m=me.exec(body))){let n=m[1].replace(/[.,。、]+$/,"").trim();if(n&&n.length<=14&&!bad.test(n)&&!/[./]/.test(n)){const p=get(n);if(r.source==="calendar")p.meet++;else p.chat++;touch(p,r);}}
    }
  });
  return Object.values(map).map(p=>{
    const parts=[["共同開発",p.dev],["同席",p.meet],["やりとり",p.chat]].filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
    p.relation=parts.length?parts[0][0]:"接点";p.breakdown=parts;
    p.records=[...p.recSet];p.total=p.records.length;return p;
  }).filter(p=>p.total>=1).sort((a,b)=>b.total-a.total);
}

/* ===== 描画 ===== */
function render(rows){
  const a=analyze(rows);ANALYSIS=a;
  PEOPLE=extractPeople(rows);
  const connSet=new Set(a.connected),connCount=connSet.size,pct=Math.round(connCount/TOTAL_STREAMS*100);
  const fmt=d=>localKey(d);const demo=!!window.__PF_DEMO__;

  document.getElementById("idline").innerHTML=`${esc(a.topCats[0]||"記録")} を軸に活動`+(a.frex?` ・ <b style="color:var(--blue-deep)">株式会社FREX</b>`:"");
  document.getElementById("chips").innerHTML=
    `<span class="chip"><span class="mono">${connCount}/${TOTAL_STREAMS}</span> 情報源</span>`+
    `<span class="chip"><span class="mono">${PEOPLE.length}</span> 人と繋がり</span>`+
    `<span class="chip grey">記録 <span class="mono">${a.total}</span> 件</span>`+
    `<span class="chip lock">🔒 本人のみ</span>`;
  document.getElementById("srcNote").textContent=demo?("サンプルデータ "+a.total+"件"):("data/timeline.json "+a.total+"件");

  const coverage=`<section class="card"><div class="sec-h"><h2>情報の網羅</h2><span class="en">coverage</span></div>
    <div class="cov"><div class="num">${connCount}<small> / ${TOTAL_STREAMS}</small></div>
      <div class="right"><div class="track"><div class="fill" id="covFill"></div></div>
      <div class="cap">人生の情報源のうち <b style="color:var(--blue-deep)">${connCount}</b> 種類と連携済み。源を増やすほど、この人の像がはっきりしていく。</div></div></div></section>`;

  const density=(a.total/a.activeDays.length).toFixed(1);
  const rowsP=[["主な活動",esc(a.topCats.join(" ・ "))],a.frex?["活動拠点","株式会社FREX"]:null,
    ["生活リズム",`${a.chrono}　/　<b>${a.peakHour}時台</b>が中心　/　よく動くのは <b>${DOW[a.peakDow]}曜</b>`],
    a.recentRepo?["最近の中心",`${esc(a.recentRepo[0])} <span style="color:var(--muted)">(直近30日 ${a.recentRepo[1]}件)</span>`]:null,
    PEOPLE.length?["よく一緒にいる",PEOPLE.slice(0,3).map(p=>esc(p.name)).join(" ・ ")]:null,
    ["記録の密度",`1日あたり 平均 <b>${density}</b> 件`],["観測期間",`${fmt(a.first)} 〜 ${fmt(a.last)}`]].filter(Boolean);
  const profile=`<section class="card"><div class="sec-h"><h2>プロフィール</h2><span class="en">profile</span></div>
    <p class="sec-sub">連携した情報から見える「この人」。</p>
    <div class="prof">${rowsP.map(([k,v])=>`<div class="row"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>
    <p class="note">※ 接続済みの情報源（${a.connected.map(srcLabel).join(" / ")}）から自動でまとめています。</p></section>`;

  // つながり
  const peopleCards=PEOPLE.length?PEOPLE.slice(0,9).map(p=>{const av=avatarFor(p.name);
    return `<div class="pcard" data-person="${esc(p.name)}"><div class="pa" style="background:${av.color}">${esc(av.initial)}</div>
      <div><div class="nm">${esc(p.name)}</div><div class="rel">${esc(p.relation)}</div></div><div class="cnt">${p.total}</div></div>`;}).join(""):
    `<div class="empty">記録のなかに、まだ他の人物が見つかっていません。<br>コミットの共著者・MTG・メンションが増えると、ここに繋がりが立ち上がります。</div>`;
  const people=`<section class="card"><div class="sec-h"><h2>つながり</h2><span class="en">people · ${PEOPLE.length}</span></div>
    <p class="sec-sub">記録に登場する人たち。クリックで、その人との関係が立ち上がる。</p>
    <div class="people-grid">${peopleCards}</div></section>`;

  // 聞いてみる
  const exP=PEOPLE[0]?`${PEOPLE[0].name}と何をした？`:"最近よく聴いた音楽";
  const examples=[exP,"誰とよく仕事してる？","最近の記録","週末は何してた？"];
  const ask=`<section class="card ask"><div class="sec-h"><h2>このファイルに聞く</h2><span class="en">recall</span></div>
    <p class="sec-sub">いつ・誰と・何をしたか、日本語で聞ける。</p>
    <div class="field"><span class="qi">？</span><input id="ask" placeholder="例: ${esc(exP)} / 誰とよく仕事してる？" autocomplete="off" /></div>
    <div class="chips" id="askChips">${examples.map(e=>`<span class="qchip">${esc(e)}</span>`).join("")}</div>
    <div id="answer"></div>
    <p class="note">※ ここはローカルの簡易応答。実環境では <b>my.recall(意味検索) + Claude</b> が本物の自然文で答える。</p></section>`;

  const sources=`<section class="card"><div class="sec-h"><h2>連携している情報源</h2><span class="en">${connCount}/${TOTAL_STREAMS} sources</span></div>
    <p class="sec-sub">このファイルを形づくる、人生のデータ源。</p>
    ${STREAMS.map(c=>{const on=c.items.filter(it=>connSet.has(it.key)).length;
      return `<div class="cat"><div class="ch">${c.cat} <span class="cnt">${on}/${c.items.length}</span></div>
      <div class="grid">${c.items.map(it=>{const o=connSet.has(it.key);return `<div class="src-card ${o?'on':'off'}"><div class="st"><i></i>${o?'連携中':'未連携'}</div><div class="nm">${it.nm}</div><div class="md">${it.mod}</div></div>`;}).join("")}</div></div>`;}).join("")}</section>`;

  const records=`<section class="card"><div class="sec-h"><h2>記録</h2><span class="en">records</span></div>
    <p class="sec-sub">この人が残してきた記録。キーワードで引ける（複数語は AND）。</p>
    <div class="search"><span class="ico">⌕</span><input id="q" placeholder="記録を検索 … 例: refactor / 睡眠 / カフェ" autocomplete="off" /></div>
    <div id="qhead" class="qhead" style="display:none"></div><div class="recs" id="recs"></div><button class="more" id="more">もっと見る</button></section>`;

  const activity=`<section class="card"><div class="sec-h"><h2>活動の記録</h2><span class="en">activity</span></div>
    <p class="sec-sub">日々どれくらい記録が生まれているか。</p>${heatmap(a)}</section>`;

  document.getElementById("app").innerHTML=coverage+profile+people+ask+sources+records+activity;
  setTimeout(()=>{const f=document.getElementById("covFill");if(f)f.style.width=pct+"%";},250);

  wireRecords(a);
  wireSpotlight();
  wireAsk(a);
  document.querySelectorAll(".pcard").forEach(c=>c.addEventListener("click",()=>openPerson(c.dataset.person)));
}

function wireRecords(a){
  const desc=[...a.rows].reverse();let limit=20,q="";
  const recsEl=document.getElementById("recs"),moreEl=document.getElementById("more"),qheadEl=document.getElementById("qhead");
  function filtered(){const t=q.toLowerCase().split(/\s+/).filter(Boolean);if(!t.length)return desc;return desc.filter(r=>{const hay=((r.text||"")+" "+(r.body||"")+" "+(r.repo||"")+" "+r.source+" "+r.kind).toLowerCase();return t.every(x=>hay.includes(x));});}
  function draw(){const f=filtered();qheadEl.style.display=q?"block":"none";if(q)qheadEl.textContent=`${f.length} 件ヒット`;
    recsEl.innerHTML=f.length?recordRows(f.slice(0,limit)):`<div class="empty">該当する記録なし</div>`;
    moreEl.style.display=f.length>limit?"block":"none";moreEl.textContent=`もっと見る（残り ${Math.max(0,f.length-limit)} 件）`;}
  document.getElementById("q").addEventListener("input",e=>{q=e.target.value;limit=20;draw();});
  moreEl.addEventListener("click",()=>{limit+=40;draw();});draw();
}

/* ===== 人物検索(スポットライト) ===== */
function wireSpotlight(){
  const inp=document.getElementById("spot"),drop=document.getElementById("spotDrop");
  function close(){drop.classList.remove("on");}
  inp.addEventListener("input",()=>{
    const q=inp.value.trim().toLowerCase();
    if(!q){close();return;}
    const ppl=PEOPLE.filter(p=>p.name.toLowerCase().includes(q)).slice(0,6);
    let html="";
    if(ppl.length){html+=`<div class="res-head">人物</div>`+ppl.map(p=>{const av=avatarFor(p.name);
      return `<div class="res" data-person="${esc(p.name)}"><div class="pa" style="background:${av.color}">${esc(av.initial)}</div><div><div class="nm">${esc(p.name)}</div><div class="sub">${esc(p.relation)} ・ ${p.total}回の接点</div></div><div class="go">ファイルを開く →</div></div>`;}).join("");}
    else{html+=`<div class="res-none">「${esc(inp.value)}」に一致する人物はいません。記録の検索は下の「記録」セクションから。</div>`;}
    drop.innerHTML=html;drop.classList.add("on");
    drop.querySelectorAll(".res[data-person]").forEach(el=>el.addEventListener("click",()=>{close();inp.value="";openPerson(el.dataset.person);}));
  });
  document.addEventListener("click",e=>{if(!e.target.closest(".spot"))close();});
}

/* ===== 人物ファイル ===== */
function openPerson(name){
  const p=PEOPLE.find(x=>x.name===name);if(!p)return;
  const av=avatarFor(p.name);const fmt=d=>localKey(new Date(d));
  const recs=[...p.records].sort((x,y)=>new Date(y.dt)-new Date(x.dt));
  const bd=p.breakdown.map(([k,v])=>`<span class="pb">${k} <b>${v}</b></span>`).join("");
  document.getElementById("pvWrap").innerHTML=`<div class="pv-card">
    <button class="pv-back" id="pvBack">← 戻る</button>
    <div class="pv-head"><div class="pv-ava" style="background:${av.color}">${esc(av.initial)}</div>
      <div><div class="pv-rel">${esc(p.relation)}</div><h2>${esc(p.name)}</h2>
      <div class="pv-meta">あなたと <b style="color:var(--ink)">${p.total}</b> 回の接点 ・ ${fmt(p.first)} 〜 ${fmt(p.last)}</div>
      <div class="pv-bd">${bd}</div></div></div>
    <div class="pv-sub">一緒の記録（${recs.length}件）</div>
    <div class="recs">${recordRows(recs.slice(0,40))}</div></div>`;
  const pv=document.getElementById("personView");pv.hidden=false;document.body.style.overflow="hidden";
  document.getElementById("pvBack").addEventListener("click",closePerson);
}
function closePerson(){document.getElementById("personView").hidden=true;document.body.style.overflow="";}
document.getElementById("pvBg").addEventListener("click",closePerson);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePerson();});

/* ===== 聞いてみる ===== */
function wireAsk(a){
  const inp=document.getElementById("ask"),out=document.getElementById("answer");
  function run(){const q=inp.value.trim();if(!q){out.innerHTML="";return;}const r=answerQuestion(q,a,PEOPLE);
    out.innerHTML=`<div class="ans">${r.html}</div>`+(r.recs.length?`<div class="recs" style="margin-top:6px">${recordRows(r.recs)}</div>`:"");}
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")run();});
  document.querySelectorAll("#askChips .qchip").forEach(c=>c.addEventListener("click",()=>{inp.value=c.textContent;run();inp.focus();}));
}
function answerQuestion(q,a,people){
  const fmt=d=>localKey(new Date(d));const mk=(html,recs)=>({html,recs:recs||[]});
  const person=people.find(p=>q.includes(p.name));
  if(person){const recs=[...person.records].sort((x,y)=>new Date(y.dt)-new Date(x.dt));
    const bd=person.breakdown.map(([k,v])=>`${k} ${v}回`).join(" / ");
    return mk(`<b>${esc(person.name)}</b> とは <b>${person.total}回</b> 接点があります。最初は ${fmt(person.first)}、最近は ${fmt(person.last)}。主に <b>${person.relation}</b>（${bd}）。下が一緒の記録です。`,recs.slice(0,25));}
  if(/誰|だれ|人と|仲|よく.*(仕事|一緒)/.test(q)){const top=people.slice(0,5);
    if(top.length)return mk(`よく関わっているのは <b>${esc(top[0].name)}</b> を筆頭に ${top.map(p=>esc(p.name)+"（"+p.relation+" "+p.total+"回）").join("、")}。名前をクリックするとその人のファイルが開きます。`,[]);}
  const CONCEPTS=[{re:/音楽|曲|聴/,srcs:["music"],label:"音楽"},{re:/睡眠|運動|健康|歩|寝/,srcs:["health","weight"],label:"健康"},{re:/読書|本|読ん/,srcs:["reading"],label:"読書"},{re:/動画|youtube/i,srcs:["youtube"],label:"動画"},{re:/場所|どこ|行っ|滞在/,srcs:["location"],label:"場所"},{re:/コミット|開発|コード|実装|プログラ|git/i,srcs:["git","github"],label:"開発"},{re:/予定|会議|ミーティング|打ち合わせ|mtg/i,srcs:["calendar"],label:"予定"},{re:/ツイート|つぶや|呟/,srcs:["x"],label:"X"},{re:/連絡|チャット|slack/i,srcs:["slack"],label:"チャット"}];
  const TIMES=[{re:/週末/,fn:r=>r._d.getDay()===0||r._d.getDay()===6,label:"週末"},{re:/平日/,fn:r=>r._d.getDay()>=1&&r._d.getDay()<=5,label:"平日"},{re:/朝/,fn:r=>r._d.getHours()>=5&&r._d.getHours()<=10,label:"朝"},{re:/夜|深夜|晩/,fn:r=>r._d.getHours()>=18||r._d.getHours()<=4,label:"夜"},{re:/昼|日中/,fn:r=>r._d.getHours()>=11&&r._d.getHours()<=17,label:"日中"}];
  const preds=[],labels=[],srcSel=new Set();
  CONCEPTS.forEach(c=>{if(c.re.test(q)){c.srcs.forEach(s=>srcSel.add(s));labels.push(c.label);}});
  if(srcSel.size)preds.push(r=>srcSel.has(r.source));
  TIMES.forEach(t=>{if(t.re.test(q)){preds.push(t.fn);labels.push(t.label);}});
  if(/最近|この頃|このごろ/.test(q)){const c=new Date(a.last);c.setDate(c.getDate()-14);preds.push(r=>r._d>=c);labels.push("最近");}
  const mm=q.match(/(\d{1,2})\s*月/);if(mm){const m=+mm[1];preds.push(r=>r._d.getMonth()+1===m);labels.push(m+"月");}
  let hits,how;
  if(preds.length){hits=a.rows.filter(r=>preds.every(p=>p(r)));how=labels.join(" × ");}
  else{const stop=/^(の|に|を|は|が|で|と|へ|や|か|も|な|よ|ね|だ|です|ます|した|する|何|なに|いつ|どこ|どの|教えて|ください|くらい|ぐらい|頃|たい|こと|もの)$/;
    const terms=q.replace(/[？?、。!！\s]+/g," ").split(" ").map(s=>s.trim()).filter(s=>s&&!stop.test(s));
    hits=terms.length?a.rows.filter(r=>{const hay=((r.text||"")+" "+(r.body||"")+" "+(r.repo||"")+" "+r.source).toLowerCase();return terms.some(t=>hay.includes(t.toLowerCase()));}):a.rows;how="「"+esc(q)+"」";}
  if(!hits.length)return mk(`${how} に当てはまる記録は見つかりませんでした。別の言い方で聞いてみて。`,[]);
  hits=[...hits].sort((x,y)=>new Date(y.dt)-new Date(x.dt));
  const cats=count(hits.map(r=>SRC_CAT[r.source]||r.source));const topCat=topEntries(cats,2).map(([k])=>k).join("・");
  return mk(`<b>${how}</b> に当てはまる記録は <b>${hits.length}件</b>。${fmt(hits[hits.length-1].dt)} 〜 ${fmt(hits[0].dt)}、主に <b>${topCat}</b>。下が該当の記録です。`,hits.slice(0,25));
}

function recordRows(list){return list.map(r=>{const d=new Date(r.dt);
  const when=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
  return `<div class="rec"><div class="when">${when}</div><div><span class="src"><i style="background:${srcColor(r.source)}"></i>${esc(srcLabel(r.source))}</span></div><div class="txt">${esc(r.text)||"<span style='color:var(--muted)'>（本文なし）</span>"}</div></div>`;}).join("");}

function heatmap(a){const first=a.first,last=a.last;
  const start=new Date(first.getFullYear(),first.getMonth(),first.getDate());start.setDate(start.getDate()-start.getDay());
  const end=new Date(last.getFullYear(),last.getMonth(),last.getDate());const weeks=[],monthLabels=[];let cur=new Date(start);
  while(cur<=end){const col=[];let label="";for(let i=0;i<7;i++){const key=localKey(cur);const c=a.perDay[key]||0;col.push({key,c,lvl:c===0?0:c<=1?1:c<=3?2:c<=6?3:4});if(cur.getDate()<=7&&i===0)label=(cur.getMonth()+1)+"月";cur.setDate(cur.getDate()+1);}weeks.push(col);monthLabels.push(label);}
  const cols=weeks.map(col=>`<div class="col">`+col.map(d=>`<div class="cell ${d.lvl?'l'+d.lvl:''}" title="${d.key}: ${d.c} 件"></div>`).join("")+`</div>`).join("");
  return `<div class="heat-scroll"><div class="heat-wrap"><div class="dow"><span>日</span><span></span><span>火</span><span></span><span>木</span><span></span><span>土</span></div>
    <div><div class="month-row">${monthLabels.map(l=>`<span style="width:12px">${l||""}</span>`).join("")}</div><div class="heat">${cols}</div></div></div></div>
    <div class="legend">少 <div class="cell"></div><div class="cell l1"></div><div class="cell l2"></div><div class="cell l3"></div><div class="cell l4"></div> 多</div>`;}

main();
</script>
